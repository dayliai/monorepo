<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Daily Living Labs is a community that helps families and caregivers find practical solutions for the activities of daily living — built with accessibility at its core." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Daily Living Labs — Practical Solutions for Daily Life</title>
    <meta name="color-scheme" content="light dark" />
    <!-- Theme: use the saved choice, otherwise follow the device. Runs before paint so there's no flash.
         Keep the 'dll-theme' key in sync with THEME_STORAGE_KEY in @dayli/ui. -->
    <script>
      (function () {
        var t = null
        try { t = localStorage.getItem('dll-theme') } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.setAttribute('data-theme', t)
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800&display=swap" rel="stylesheet" />
